<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Vocab</title>
  <meta name="theme-color" content="#6b2fb3" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vocab" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <section id="view-learn" class="view" data-view="learn"></section>
    <section id="view-revise" class="view" data-view="revise" hidden></section>
    <section id="view-revisit" class="view" data-view="revisit" hidden></section>
    <section id="view-calendar" class="view" data-view="calendar" hidden></section>
  </main>

  <nav id="tab-bar">
    <button class="tab-button" data-tab="learn" aria-current="page">
      <span class="tab-icon">📖</span>
      <span class="tab-label">Learn</span>
    </button>
    <button class="tab-button" data-tab="revise">
      <span class="tab-icon">🗂️</span>
      <span class="tab-label">Revise</span>
    </button>
    <button class="tab-button" data-tab="revisit">
      <span class="tab-icon">🔁</span>
      <span class="tab-label">Revisit</span>
    </button>
    <button class="tab-button" data-tab="calendar">
      <span class="tab-icon">📅</span>
      <span class="tab-label">Calendar</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
